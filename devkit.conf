# The settings of this repository for DMDevKit, schema version 1. Tools/Package.swift pins the
# DMDevKit that reads them. This file is shell code that runs with the rights of whoever runs a
# script, so review a change to it like any other code.
#
# Every setting of this repository is written here once. The commands read these names:
# check-lint-contract SOURCE_DIR, RULES and FIXTURE_DIR; check-api MODULE, SOURCE_DIR, SWIFT_FLAGS,
# LIBRARY_EVOLUTION, DEPENDENCIES and PREPARE; check-release FROZEN_POD_VERSION and MODULE, which
# names the podspec; check-wrappers WRAPPERS, the scripts of Scripts/ that forward to devkit, each
# one named by its file. SWIFT_FLAGS repeats what Package.swift sets for the library, so change
# both.
DEVKIT_CONF_VERSION=1
# The module whose public interface is checked, and the directory the manifest compiles for it.
MODULE="DMUnLoader"
SOURCE_DIR="Sources/DMUnLoader"
RULES="domain_imports force_unwrapping no_process_termination"
FIXTURE_DIR="Fixtures/Lint"
# The language mode and the upcoming features that the manifest sets for the module.
SWIFT_FLAGS=(-swift-version 6 -parse-as-library -enable-upcoming-feature ExistentialAny)
# The package is not built for library evolution, and with it the compiler rejects the sources:
# "'ObservableObject' aliases 'Combine.ObservableObject' and cannot be used in a public conformance
# because 'Combine' was not imported by this file".
LIBRARY_EVOLUTION="no"
# The CocoaPods channel ended with 1.1.0 (README, "CocoaPods"). The podspec stays at that version;
# the release version is checked against the changelog alone.
FROZEN_POD_VERSION="1.1.0"
# The modules of package dependencies that the module imports, compiled first and in this order, as
# "<module>|<source directory>|<compiler flags>": the flags mirror the manifest of the dependency,
# its -package-name included. The sources are the checkouts that PREPARE resolves, at the revisions
# of Package.resolved.
DEPENDENCIES=(
    "DMAction|.build/checkouts/DMAction/Sources|-swift-version 6 -parse-as-library -enable-upcoming-feature ExistentialAny -package-name DMAction"
    "DMVariableBlurView|.build/checkouts/DMVariableBlurView/Sources/DMVariableBlurView|-swift-version 6 -parse-as-library -enable-upcoming-feature ExistentialAny -package-name DMVariableBlurView"
)
# A command run from the repository root before anything is compiled: it checks out the
# dependencies at the revisions of Package.resolved, or fetches them on a fresh clone.
PREPARE=(swift package resolve)
WRAPPERS=(lint.sh check-lint-contract.sh check-lint-tool.sh prepare-simulator.sh check-api.sh check-release.sh export-coverage.sh count-tests.sh check-wrappers.sh)
