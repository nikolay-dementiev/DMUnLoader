swiftlint_version: 0.65.1
included:
  - Sources
  - Tests
  - Examples/DMUnLoaderExample
  - Fixtures

disabled_rules:
  # Blank lines carry their indentation throughout the sources.
  - trailing_whitespace
  # One open note in the library, about colours in light and dark appearance.
  - todo

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

analyzer_rules:
  - unused_import

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

# Every public symbol is documented. By default the rule skips the members of a type that
# conforms to a protocol, which is every public type of the library.
missing_docs:
  error: [open, public]
  excludes_inherited_types: false

custom_rules:
  no_process_termination:
    name: "No process termination"
    # The library only: the consumer fixture compiles the README samples as they are.
    included: ".*/Sources/DMUnLoader/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure)\b'
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
  domain_imports_no_ui_or_platform:
    name: "Domain imports no UI or platform framework"
    # The Domain layer holds the plain types and policies. A framework of the UI or of the
    # platform comes in through a protocol that an adapter implements.
    included: ".*/Sources/DMUnLoader/Domain/.*\\.swift"
    regex: '^\s*import\s+(UIKit|SwiftUI|AppKit|WatchKit|DMVariableBlurView)\b'
    message: "The Domain layer imports no UI or platform framework. Declare a protocol and let an adapter implement it."
    severity: error
