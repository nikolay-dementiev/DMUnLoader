included:
  - Sources
  - Tests
  - Examples/DMUnLoaderExample
  - Fixtures

disabled_rules:
  # Blank lines carry their indentation throughout the sources.
  - trailing_whitespace
  # One open note in the library, about colours in light and dark appearance.
  - todo

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

analyzer_rules:
  - unused_import

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

custom_rules:
  no_process_termination:
    name: "No process termination"
    # The library only: the consumer fixture compiles the README samples as they are.
    included: ".*/Sources/DMUnLoader/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure)\b'
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
