swiftlint_version: 0.65.1
included:
  - Sources
  - Tests
  - Examples/DMUnLoaderExample
  - Fixtures

disabled_rules:
  # Blank lines carry their indentation throughout the sources.
  - trailing_whitespace
  # One open note in the library, about colours in light and dark appearance.
  - todo

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

analyzer_rules:
  - unused_import

# Two imports that the analyzer does not see used. ObservableObject is a typealias in Foundation
# that names Combine.ObservableObject, so it finds no declaration of Combine used in a file that
# only refines it; the import stays, because the compiler asks for it in a public conformance when
# the module is built with library evolution, as Scripts/check-api.sh records. The analyzer finds
# CGSize in CoreFoundation, while the compiler needs CoreGraphics for its conformances.
unused_import:
  always_keep_imports:
    - Combine
  allowed_transitive_imports:
    - module: CoreGraphics
      allowed_transitive_imports:
        - CoreFoundation

# By default the rule lets a few calls with a literal argument be force unwrapped, such as
# URL(string: "https://example.com")!. ENGINEERING.md states no exception, so the list is empty.
force_unwrapping:
  ignored_literal_argument_functions: []

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

# Every public symbol is documented. By default the rule skips the members of a type that
# conforms to a protocol, which is every public type of the library.
missing_docs:
  error: [open, public]
  excludes_inherited_types: false

custom_rules:
  no_process_termination:
    name: "No process termination"
    # The library only: the consumer fixture compiles the README samples as they are.
    included: ".*/Sources/DMUnLoader/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure|precondition|assert|dispatchPrecondition|abort|exit)\s*\('
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
  domain_imports:
    name: "Domain imports"
    # The Domain layer holds the plain types and policies. A framework of the UI or of the
    # platform comes in through a protocol that an adapter implements. The pattern is matched
    # against the absolute path, so only the Domain folder of the library is meant.
    included: ".*/Sources/DMUnLoader/Domain/.*\\.swift"
    # Any attribute, access level and import kind; a second import after a semicolon; a submodule
    # of Foundation is allowed. Comments and strings never match. An import that follows a block
    # comment on the same line is not seen.
    regex: '(?:^|;)\s*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|typealias|func|var|let)\s+)?+(?!(?:Foundation)\b)\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The Domain folder imports Foundation only: no UI and no platform framework."
    severity: error
