name: DMUnLoaderExample
options:
  bundleIdPrefix: com.dmunloader.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  DMUnLoader:
    path: ../..
targets:
  DMUnLoaderExample:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: DMUnLoader
        product: DMUnLoader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmunloader.example.app
        INFOPLIST_KEY_CFBundleDisplayName: DMUnLoader
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  DMUnLoaderExample:
    build:
      targets:
        DMUnLoaderExample: all
    run:
      config: Debug
