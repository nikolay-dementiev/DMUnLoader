# The actions of the workflows are pinned to commits, and the package's dependencies are
# resolved in the committed Package.resolved. Dependabot proposes the newer ones. The tools
# manifest in Tools/ pins DMDevKit and keeps a lockfile of its own, and Dependabot proposes its
# newer releases too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is proposed a week after it appears, not on the day it does.
    cooldown:
      default-days: 7
    # The minor and patch updates of an ecosystem come as one pull request a week, so that a merge
    # to main does not make Dependabot rebase several at once. A major update stays a pull request
    # of its own: it needs its own lines in the changelog.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /Tools
    schedule:
      interval: weekly
    # A release of DMDevKit is proposed a week after it appears, as for an action.
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
