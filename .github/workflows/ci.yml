name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this workflow on a version tag.
  workflow_call:
  schedule:
    # Mondays, 05:17 UTC. An early warning when a new runner image or OS breaks the package.
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer commit of a pull request replaces the run of the older one. Every other run has
# a group of its own: GitHub keeps one pending run per group and drops the others, so a
# shared group would lose runs of main and the weekly run even without cancelling.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Named explicitly, so a failing xcodebuild in front of a pipe fails the step.
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: Scripts/lint.sh
      # A rule that never matches reports nothing, so the fixtures prove that each one fires.
      - name: Check that the lint rules fire
        run: Scripts/check-lint-contract.sh
      # Two runs at once on one checkout must not break each other while the tool is fetched.
      - name: Check that the lint tool is fetched safely
        run: Scripts/check-lint-tool.sh
      # The analyzer rules, unused_import among them, read the compiler invocations of a full build.
      - name: Build the library for the analyzer
        run: |
          xcodebuild build \
            -scheme DMUnLoader \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            > "$RUNNER_TEMP/build.log" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Run the analyzer rules
        run: Scripts/lint.sh --analyze "$RUNNER_TEMP/build.log"

  test:
    # The newest hosted Xcode with the newest runtime, and with the oldest runtime it offers.
    # The sources need Swift 6.2, so only an Xcode 26 can build them.
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17 Pro
            os: "26.5"
          # Not iOS 18.6 as in the example job: Xcode 26.3 on macos-15 finds no supported
          # platform for the package scheme, while the example project builds there. The
          # package suite on iOS 17.5 and 18.6 is a recorded local step.
          - name: iOS 26.2
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17 Pro
            os: "26.2"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
      # Seen by the tests as CI: a missing snapshot reference fails and is never written.
      TEST_RUNNER_CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The udid names the device, not a name and an OS: a hosted image can list a runtime with
      # no device in it, and the script creates the device then.
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          mkdir -p .build/results/ci
          xcodebuild clean build test \
            -scheme DMUnLoader \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableCodeCoverage YES \
            -resultBundlePath .build/results/ci/package.xcresult \
            -skipPackagePluginValidation \
            2>&1 | tee .build/results/ci/package.log
      # A run that lost tests, or skipped them, passes the coverage floor too. So every test method
      # of the package tests must be in the result bundle, run and passed. The pattern allows an
      # attribute before func, such as @MainActor.
      - name: Check the test count
        run: |
          EXPECTED="$(git grep -hcE '^[[:space:]]*(@[[:alnum:]_]+[[:space:]]+)*func test[[:alnum:]_]*\(\)' -- 'Tests/*.swift' \
            | awk '{ total += $1 } END { print total + 0 }')"
          xcrun xcresulttool get test-results summary --path .build/results/ci/package.xcresult > "$RUNNER_TEMP/summary.json"
          if ! jq -e --argjson expected "$EXPECTED" \
              '$expected > 0 and .totalTestCount == $expected and .passedTests == $expected and .failedTests == 0 and .skippedTests == 0' \
              "$RUNNER_TEMP/summary.json" > /dev/null; then
            echo "Expected $EXPECTED tests of the package to run and pass:"
            jq '{totalTestCount, passedTests, failedTests, skippedTests}' "$RUNNER_TEMP/summary.json"
            exit 1
          fi
          echo "All $EXPECTED tests of the package ran and passed."
      - name: No warning from this repository
        run: Scripts/check-warnings.sh .build/results/ci/package.log
      - name: Coverage floor
        run: Scripts/coverage-gate.sh .build/results/ci/package.xcresult
      - name: Check the coverage exporter
        run: python3 -B Scripts/test-export-coverage.py
      - name: Export library coverage
        run: python3 Scripts/export-coverage.py .build/results/ci/package.xcresult DMUnLoader "$RUNNER_TEMP/coverage.lcov"
      - name: Upload coverage to Codecov
        # Forks and Dependabot cannot request the OIDC credentials used for this upload.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # Codecov is a report, not a gate: an outage or a failed token request must not fail the job.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage.lcov
          disable_search: true
          plugins: noop
          disable_file_fixes: true
          fail_ci_if_error: false
          name: library-${{ matrix.name }}
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.name }}-xcresult
          path: .build/results/ci/package.xcresult

  consumer:
    name: consumer
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A check that never fails looks the same as a clean tree, so its readers are tried on texts
      # that must fail before they are trusted with the real ones. It needs no build: run it first.
      - name: Check the readers of the README and of Package.resolved
        run: Scripts/check-manifest.sh --self-test
      - name: Build the library in Release
        # Tests run in Debug. Code inside "#if DEBUG" must not hide a broken release build, and
        # a warning inside "#if !DEBUG" is not in the log of the test job, so the log is kept
        # and scanned in the next step.
        run: |
          mkdir -p .build/results/ci
          xcodebuild build \
            -scheme DMUnLoader \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            2>&1 | tee .build/results/ci/release.log
      - name: No warning from this repository (Release)
        run: Scripts/check-warnings.sh .build/results/ci/release.log
      - name: Check what a consumer gets
        run: Scripts/check-manifest.sh

  floor:
    # The manifest declares Swift tools 6.2: the oldest hosted Xcode with that compiler has
    # to build the library.
    name: floor
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the library with Xcode 26.0.1
        # xcodebuild accepts no iOS destination with this Xcode on the image ("iOS 26.0 is
        # not installed"), so SwiftPM builds against its simulator SDK directly.
        # -v prints the compiler invocations with the paths of this checkout. A log of a clean
        # build names none, and the scan of the next step takes such a log for the log of
        # another build.
        run: |
          mkdir -p .build/results/ci
          swift build -v \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --product DMUnLoader \
            2>&1 | tee .build/results/ci/floor.log
      - name: No warning from this repository
        run: Scripts/check-warnings.sh .build/results/ci/floor.log

  api:
    # The interface text depends on the compiler, so this job runs on one pinned Xcode.
    name: api
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the normalisation of the interface text
        run: Scripts/check-api.sh --self-test
      - name: Compare the public interface with the baseline
        run: Scripts/check-api.sh
      # What the pull request removes, changes or adds in the baseline, for the reviewer. The
      # comparison above is the one that fails; this step fails only when it cannot compare. The
      # text is indented as a code block: a line of a fork's baseline could close a fence.
      - name: Write the interface delta against the base to the job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          Scripts/check-api.sh --since "$BASE_SHA" > "$RUNNER_TEMP/delta.txt" 2>&1 || status=$?
          {
            echo "### Public interface against the base of the pull request"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/delta.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0 | 3 | 4) ;;
            1)
              if ! grep -q '^Removed or changed' "$RUNNER_TEMP/delta.txt"; then
                cat "$RUNNER_TEMP/delta.txt" >&2
                exit 1
              fi
              ;;
            *)
              cat "$RUNNER_TEMP/delta.txt" >&2
              exit "$status"
              ;;
          esac

  thread-sanitizer:
    # The library runs on the main actor, except the nonisolated == and hash(into:) of the
    # loading manager, which any thread may call. The sanitizer checks those, and whatever a
    # later change moves off the main actor.
    name: thread-sanitizer
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEST_RUNNER_CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the simulator
        env:
          DEVICE: iPhone 17 Pro
          OS: "26.5"
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Test with the Thread Sanitizer
        # The snapshot test classes compare images, which says nothing about data races and
        # is slow under the sanitizer, so this job skips them. The test job runs them on each
        # of its matrix cells.
        run: |
          mkdir -p .build/results/ci
          xcodebuild test \
            -scheme DMUnLoader \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableThreadSanitizer YES \
            -skip-testing:DMUnLoaderTests/DMErrorViewTests \
            -skip-testing:DMUnLoaderTests/DMLoadingViewTests \
            -skip-testing:DMUnLoaderTests/DMProgressViewTests \
            -skip-testing:DMUnLoaderTests/DMSuccessViewTests \
            -skip-testing:DMUnLoaderTests/AccessibilitySnapshotTests \
            -skip-testing:DMUnLoaderTests/RightToLeftSnapshotTests \
            -resultBundlePath .build/results/ci/thread-sanitizer.xcresult \
            -skipPackagePluginValidation
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thread-sanitizer-xcresult
          path: .build/results/ci/thread-sanitizer.xcresult

  podspec:
    # The pod is frozen at 1.1.0 and nothing goes to the trunk again. The job lints the current
    # sources as a pod against the frozen sibling pods (`~> 1.1` from the trunk), so it holds only
    # while the sources use nothing the siblings added after 1.1.0.
    name: podspec
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the podspec and check what a consumer gets
        run: Scripts/check-podspec.sh

  docs:
    name: docs
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A broken symbol link or a parameter documented under the wrong name is a warning to
      # DocC and an error here.
      - name: Build the documentation
        run: |
          xcodebuild docbuild \
            -scheme DMUnLoader \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

  example:
    name: example (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
            device: iPhone 17 Pro
            os: "26.5"
          # Not iOS 26.2 as in the test job: iOS 18.6, the system the touch fix was made
          # for, runs with Xcode 26.3 on macos-15, where the example project builds and the
          # package scheme finds no supported platform. The example on iOS 17.5 is a
          # recorded local step.
          - name: iOS 18.6
            runner: macos-15
            xcode: /Applications/Xcode_26.3.app
            device: iPhone 16 Pro
            os: "18.6"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
      # Seen by the tests as CI: a missing snapshot reference fails and is never written.
      TEST_RUNNER_CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The udid names the device, not a name and an OS: a hosted image can list a runtime with
      # no device in it, and the script creates the device then.
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Build the example and run its tests, one launch mode at a time
        run: Scripts/test-example.sh "$UDID" .build/results/ci/example
      - name: No warning from this repository
        run: Scripts/check-warnings.sh .build/results/ci/example/build-for-testing.log
      - name: Upload the result bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-${{ matrix.name }}-results
          path: .build/results/ci/example
